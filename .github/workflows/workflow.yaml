          exit 1
        fi
        echo "instrumentation check passed"
  require_suites:
    runs-on: ubuntu-latest
    name: "Require a suite.yaml file alongside every template.yaml"
    steps:
    - name: Harden Runner
      continue-on-error: true     # racecar: scan/report/push step, must not fail the build
